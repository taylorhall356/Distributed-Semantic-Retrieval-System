events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream embedding_backend {
        zone embedding_backend 64k;
        least_conn;
        server embedding-service:8090 resolve max_fails=2 fail_timeout=10s;
        server embedding-service2:8090 resolve max_fails=2 fail_timeout=10s;
        server embedding-service3:8090 resolve max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8090;
        server_name _;

        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;

        location / {
            proxy_pass http://embedding_backend;
            proxy_http_version 1.1;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}
