      DB_PORT: "5432"
      DB_NAME: semantic_retrieval
      DB_USER: semantic_user
      DB_PASSWORD: semantic_password
      JWT_SECRET: development-secret-key-at-least-32-bytes
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: document-storage
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DOCUMENT_PROCESSING_QUEUE: document_processing
      DOCUMENT_PARSING_QUEUE: document_parsing
      DOCUMENT_EMBEDDING_QUEUE: document_embedding
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: document_chunks
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_VECTOR_SIZE: "384"
      EMBEDDING_SERVICE_URL: http://embedding-service:8090
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      QUERY_EMBEDDING_CACHE_TTL_SECONDS: "3600"
      QUERY_EMBEDDING_CACHE_LOGGING: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

  api3:
    build:
      context: .
    container_name: semantic-retrieval-api-3
    depends_on:
      - bootstrap
      - embedding-service
      - postgres
      - qdrant
      - rabbitmq
      - redis
      - minio
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: semantic_retrieval
      DB_USER: semantic_user
      DB_PASSWORD: semantic_password
      JWT_SECRET: development-secret-key-at-least-32-bytes
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: document-storage
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DOCUMENT_PROCESSING_QUEUE: document_processing
      DOCUMENT_PARSING_QUEUE: document_parsing
      DOCUMENT_EMBEDDING_QUEUE: document_embedding
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: document_chunks
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_VECTOR_SIZE: "384"
      EMBEDDING_SERVICE_URL: http://embedding-service:8090
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      QUERY_EMBEDDING_CACHE_TTL_SECONDS: "3600"
      QUERY_EMBEDDING_CACHE_LOGGING: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    build:
      context: .
    container_name: semantic-retrieval-worker
    command:
      - sh
      - -c
      - >
        celery -A tasks worker
        --loglevel=info
        --pool="$${CELERY_WORKER_POOL}"
        --concurrency="$${CELERY_WORKER_CONCURRENCY}"
        --queues="$${DOCUMENT_PARSING_QUEUE}"
    depends_on:
      - bootstrap
      - embedding-service
      - postgres
      - qdrant
      - rabbitmq
      - redis
      - minio
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: semantic_retrieval
      DB_USER: semantic_user
      DB_PASSWORD: semantic_password
      JWT_SECRET: development-secret-key-at-least-32-bytes
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: document-storage
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DOCUMENT_PROCESSING_QUEUE: document_processing
      DOCUMENT_PARSING_QUEUE: document_parsing
      DOCUMENT_EMBEDDING_QUEUE: document_embedding
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: document_chunks
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_VECTOR_SIZE: "384"
      EMBEDDING_SERVICE_URL: http://embedding-service:8090
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      QUERY_EMBEDDING_CACHE_TTL_SECONDS: "3600"
      QUERY_EMBEDDING_CACHE_LOGGING: "true"
      CELERY_WORKER_POOL: prefork
      CELERY_WORKER_CONCURRENCY: "2"
      WORKER_ROLE: parsing

  worker2:
    build:
      context: .
    container_name: semantic-retrieval-worker-2
    command:
      - sh
      - -c
      - >
        celery -A tasks worker
        --loglevel=info
        --pool="$${CELERY_WORKER_POOL}"
        --concurrency="$${CELERY_WORKER_CONCURRENCY}"
        --queues="$${DOCUMENT_PARSING_QUEUE}"
    depends_on:
      - bootstrap
      - embedding-service
      - postgres
      - qdrant
      - rabbitmq
      - redis
      - minio
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: semantic_retrieval
      DB_USER: semantic_user
      DB_PASSWORD: semantic_password
      JWT_SECRET: development-secret-key-at-least-32-bytes
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: document-storage
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DOCUMENT_PROCESSING_QUEUE: document_processing
      DOCUMENT_PARSING_QUEUE: document_parsing
      DOCUMENT_EMBEDDING_QUEUE: document_embedding
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: document_chunks
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_VECTOR_SIZE: "384"
      EMBEDDING_SERVICE_URL: http://embedding-service:8090
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      QUERY_EMBEDDING_CACHE_TTL_SECONDS: "3600"
      QUERY_EMBEDDING_CACHE_LOGGING: "true"
      CELERY_WORKER_POOL: prefork
      CELERY_WORKER_CONCURRENCY: "2"
      WORKER_ROLE: parsing

  embedding-worker:
    build:
      context: .
    container_name: semantic-retrieval-embedding-worker
    command:
      - sh
      - -c
      - >
        celery -A tasks worker
        --loglevel=info
        --pool="$${CELERY_WORKER_POOL}"
        --concurrency="$${CELERY_WORKER_CONCURRENCY}"
        --queues="$${DOCUMENT_EMBEDDING_QUEUE}"
    depends_on:
      - bootstrap
      - embedding-service
      - postgres
      - qdrant
      - rabbitmq
      - redis
      - minio
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: semantic_retrieval
      DB_USER: semantic_user
      DB_PASSWORD: semantic_password
      JWT_SECRET: development-secret-key-at-least-32-bytes
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: document-storage
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DOCUMENT_PROCESSING_QUEUE: document_processing
      DOCUMENT_PARSING_QUEUE: document_parsing
      DOCUMENT_EMBEDDING_QUEUE: document_embedding
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: document_chunks
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_VECTOR_SIZE: "384"
      EMBEDDING_SERVICE_URL: http://embedding-service:8090
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      QUERY_EMBEDDING_CACHE_TTL_SECONDS: "3600"
      QUERY_EMBEDDING_CACHE_LOGGING: "true"
      CELERY_WORKER_POOL: prefork
      CELERY_WORKER_CONCURRENCY: "2"
      WORKER_ROLE: embedding

  postgres:
    image: postgres:16
    container_name: semantic-retrieval-postgres
    environment:
      POSTGRES_DB: semantic_retrieval
      POSTGRES_USER: semantic_user
      POSTGRES_PASSWORD: semantic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: semantic-retrieval-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:3-management
    container_name: semantic-retrieval-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: semantic-retrieval-redis
    environment:
      REDIS_MAXMEMORY: 128mb
      REDIS_MAXMEMORY_POLICY: allkeys-lru
    ports:
      - "6379:6379"
    command:
      - sh
      - -c
      - >
        redis-server
        --save ""
        --appendonly no
        --maxmemory "$${REDIS_MAXMEMORY}"
        --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY}"

  minio:
    image: minio/minio:latest
    container_name: semantic-retrieval-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  locust:
    build:
      context: .
    container_name: semantic-retrieval-locust
    profiles:
      - loadtest
    depends_on:
      - nginx
    entrypoint: ["locust", "-f", "load/locustfile.py", "--host", "http://nginx"]
    ports:
      - "8089:8089"

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  minio_data:
