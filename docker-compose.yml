services:
  nginx:
    image: nginx:1.27-alpine
    container_name: semantic-retrieval-nginx
    depends_on:
      - api
      - api2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  api:
    build:
      context: .
    container_name: semantic-retrieval-api
    depends_on:
      - postgres
      - qdrant
      - rabbitmq
      - minio
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: semantic_retrieval
      DB_USER: semantic_user
      DB_PASSWORD: semantic_password
      JWT_SECRET: development-secret-key-at-least-32-bytes
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: document-storage
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DOCUMENT_PROCESSING_QUEUE: document_processing
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: document_chunks
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2

  api2:
    build:
      context: .
    container_name: semantic-retrieval-api-2
    depends_on:
      - postgres
      - qdrant
      - rabbitmq
      - minio
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: semantic_retrieval
      DB_USER: semantic_user
      DB_PASSWORD: semantic_password
      JWT_SECRET: development-secret-key-at-least-32-bytes
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: document-storage
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DOCUMENT_PROCESSING_QUEUE: document_processing
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: document_chunks
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2

  worker:
    build:
      context: .
    container_name: semantic-retrieval-worker
    command: celery -A tasks worker --loglevel=info --pool=solo --concurrency=1
    depends_on:
      - postgres
      - qdrant
      - rabbitmq
      - minio
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: semantic_retrieval
      DB_USER: semantic_user
      DB_PASSWORD: semantic_password
      JWT_SECRET: development-secret-key-at-least-32-bytes
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: document-storage
      MINIO_SECURE: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      DOCUMENT_PROCESSING_QUEUE: document_processing
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: document_chunks
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2

  postgres:
    image: postgres:16
    container_name: semantic-retrieval-postgres
    environment:
      POSTGRES_DB: semantic_retrieval
      POSTGRES_USER: semantic_user
      POSTGRES_PASSWORD: semantic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: semantic-retrieval-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:3-management
    container_name: semantic-retrieval-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    container_name: semantic-retrieval-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  minio_data:
