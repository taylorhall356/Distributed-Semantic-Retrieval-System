name: semantic-retrieval

x-app-build: &app-build
  context: .
  args:
    PRELOAD_MODEL_ASSETS: ${PRELOAD_MODEL_ASSETS:-false}
  target: app-runtime

x-parse-build: &parse-build
  context: .
  args:
    PRELOAD_MODEL_ASSETS: ${PRELOAD_MODEL_ASSETS:-false}
  target: parse-runtime

x-embedding-build: &embedding-build
  context: .
  args:
    PRELOAD_MODEL_ASSETS: ${PRELOAD_MODEL_ASSETS:-false}
  target: embedding-runtime

x-app-image: &app-image
  image: semantic-retrieval-app-base:local
  build: *app-build

x-parse-image: &parse-image
  image: semantic-retrieval-app-parse:local
  build: *parse-build

x-embedding-image: &embedding-image
  image: semantic-retrieval-app-embedding:local
  build: *embedding-build

x-app-environment: &app-environment
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-semantic_retrieval}
  DB_USER: ${DB_USER:-semantic_user}
  DB_PASSWORD: ${DB_PASSWORD:-semantic_password}
  JWT_SECRET: ${JWT_SECRET:-development-secret-key-at-least-32-bytes}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-document-storage}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
  DOCUMENT_PROCESSING_QUEUE: ${DOCUMENT_PROCESSING_QUEUE:-document_processing}
  DOCUMENT_PARSING_QUEUE: ${DOCUMENT_PARSING_QUEUE:-document_parsing}
  DOCUMENT_EMBEDDING_QUEUE: ${DOCUMENT_EMBEDDING_QUEUE:-document_embedding}
  QDRANT_HOST: ${QDRANT_HOST:-qdrant}
  QDRANT_PORT: ${QDRANT_PORT:-6333}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-document_chunks}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
  EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-384}
  EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-http://embedding-router:8090}
  EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-120}
  REDIS_ENABLED: ${REDIS_ENABLED:-true}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  QUERY_EMBEDDING_CACHE_TTL_SECONDS: ${QUERY_EMBEDDING_CACHE_TTL_SECONDS:-3600}
  QUERY_EMBEDDING_CACHE_LOGGING: ${QUERY_EMBEDDING_CACHE_LOGGING:-true}
  DOCUMENT_PROCESSING_STALE_SECONDS: ${DOCUMENT_PROCESSING_STALE_SECONDS:-900}
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}

x-app-depends-on: &app-depends-on
  bootstrap:
    condition: service_completed_successfully
  embedding-router:
    condition: service_healthy
  postgres:
    condition: service_healthy
  qdrant:
    condition: service_started
  rabbitmq:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_started

x-api-service: &api-service
  <<: *app-image
  restart: unless-stopped
  command:
    - uvicorn
    - main:app
    - --host
    - 0.0.0.0
    - --port
    - "8080"
  depends_on: *app-depends-on
  environment: *app-environment
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 120s

x-worker-service: &worker-service
  <<: *app-image
  restart: unless-stopped
  depends_on: *app-depends-on
  environment:
    <<: *app-environment
    CELERY_WORKER_POOL: ${CELERY_WORKER_POOL:-prefork}
    CELERY_WORKER_CONCURRENCY: ${PARSE_WORKER_CONCURRENCY:-1}

x-parse-worker-service: &parse-worker-service
  <<: *worker-service
  image: semantic-retrieval-app-parse:local
  build: *parse-build

services:
  bootstrap:
    <<: *app-image
    command: python bootstrap.py
    depends_on:
      embedding-router:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-semantic_retrieval}
      DB_USER: ${DB_USER:-semantic_user}
      DB_PASSWORD: ${DB_PASSWORD:-semantic_password}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-document-storage}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-document_chunks}
      EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-384}

  embedding-service:
    <<: *embedding-image
    restart: unless-stopped
    command: uvicorn embedding_service:app --host 0.0.0.0 --port 8090
    environment:
      <<: *app-environment
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  embedding-service2:
    <<: *embedding-image
    restart: unless-stopped
    command: uvicorn embedding_service:app --host 0.0.0.0 --port 8090
    environment:
      <<: *app-environment
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  embedding-service3:
    <<: *embedding-image
    restart: unless-stopped
    command: uvicorn embedding_service:app --host 0.0.0.0 --port 8090
    environment:
      <<: *app-environment
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  embedding-router:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      embedding-service:
        condition: service_healthy
      embedding-service2:
        condition: service_healthy
      embedding-service3:
        condition: service_healthy
    volumes:
      - ./nginx/embedding-router.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
      api4:
        condition: service_healthy
      api5:
        condition: service_healthy
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  api:
    <<: *api-service

  api2:
    <<: *api-service

  api3:
    <<: *api-service

  api4:
    <<: *api-service

  api5:
    <<: *api-service

  worker:
    <<: *parse-worker-service
    command:
      - sh
      - -c
      - >
        celery -A tasks worker
        --loglevel=info
        --pool="$${CELERY_WORKER_POOL}"
        --concurrency="$${CELERY_WORKER_CONCURRENCY}"
        --queues="$${DOCUMENT_PARSING_QUEUE}"
    environment:
      <<: *app-environment
      CELERY_WORKER_POOL: ${CELERY_WORKER_POOL:-prefork}
      CELERY_WORKER_CONCURRENCY: ${PARSE_WORKER_CONCURRENCY:-1}
      WORKER_ROLE: parsing

  worker2:
    <<: *parse-worker-service
    command:
      - sh
      - -c
      - >
        celery -A tasks worker
        --loglevel=info
        --pool="$${CELERY_WORKER_POOL}"
        --concurrency="$${CELERY_WORKER_CONCURRENCY}"
        --queues="$${DOCUMENT_PARSING_QUEUE}"
    environment:
      <<: *app-environment
      CELERY_WORKER_POOL: ${CELERY_WORKER_POOL:-prefork}
      CELERY_WORKER_CONCURRENCY: ${PARSE_WORKER_CONCURRENCY:-1}
      WORKER_ROLE: parsing

  worker3:
    <<: *parse-worker-service
    command:
      - sh
      - -c
      - >
        celery -A tasks worker
        --loglevel=info
        --pool="$${CELERY_WORKER_POOL}"
        --concurrency="$${CELERY_WORKER_CONCURRENCY}"
        --queues="$${DOCUMENT_PARSING_QUEUE}"
    environment:
