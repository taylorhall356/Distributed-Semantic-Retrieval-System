      CELERY_WORKER_CONCURRENCY: ${PARSE_WORKER_CONCURRENCY:-1}
      WORKER_ROLE: parsing

  embedding-worker:
    <<: *worker-service
    command:
      - sh
      - -c
      - >
        celery -A tasks worker
        --loglevel=info
        --pool="$${CELERY_WORKER_POOL}"
        --concurrency="$${CELERY_WORKER_CONCURRENCY}"
        --queues="$${DOCUMENT_EMBEDDING_QUEUE}"
    environment:
      <<: *app-environment
      CELERY_WORKER_POOL: ${CELERY_WORKER_POOL:-prefork}
      CELERY_WORKER_CONCURRENCY: ${EMBEDDING_WORKER_CONCURRENCY:-2}
      WORKER_ROLE: embedding

  embedding-worker2:
    <<: *worker-service
    command:
      - sh
      - -c
      - >
        celery -A tasks worker
        --loglevel=info
        --pool="$${CELERY_WORKER_POOL}"
        --concurrency="$${CELERY_WORKER_CONCURRENCY}"
        --queues="$${DOCUMENT_EMBEDDING_QUEUE}"
    environment:
      <<: *app-environment
      CELERY_WORKER_POOL: ${CELERY_WORKER_POOL:-prefork}
      CELERY_WORKER_CONCURRENCY: ${EMBEDDING_WORKER_CONCURRENCY:-2}
      WORKER_ROLE: embedding

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-semantic_retrieval}
      POSTGRES_USER: ${DB_USER:-semantic_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-semantic_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - sh
      - -c
      - >
        redis-server
        --save ""
        --appendonly no
        --maxmemory "$${REDIS_MAXMEMORY}"
        --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY}"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

  locust:
    build:
      context: .
      dockerfile: Dockerfile.locust
    profiles:
      - loadtest
    ports:
      - "${LOCUST_HOST_PORT:-8089}:8089"

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  minio_data:
